[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlog-mcp"
version = "0.1.0"
description = "MCP server for AI-driven video production from coding sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.0.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "pygments>=2.18.0",
    "matplotlib>=3.8.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
vlog-mcp = "vlog_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/vlog_mcp"]
